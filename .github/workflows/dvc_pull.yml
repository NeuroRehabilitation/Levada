name: DVC Pull on Push

on:
  push:
    branches:
      - main  # Or the branch you want to trigger on

jobs:
  dvc_pull:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Install DVC
      - name: Install DVC
        run: |
          pip install --upgrade pip
          pip install dvc[s3,gdrive]  # install with Google Drive support

      # 3. Configure DVC remote with secrets
      - name: Configure DVC remote
        run: |
          dvc remote modify gdrive_remote gdrive_client_id "${{ secrets.DVC_GDRIVE_CLIENT_ID }}" --local
          dvc remote modify gdrive_remote gdrive_client_secret "${{ secrets.DVC_GDRIVE_CLIENT_SECRET }}" --local

